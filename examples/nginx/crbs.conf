# CRBS nginx 反向代理示例
#
# 将该文件复制到 /etc/nginx/conf.d/crbs.conf（或对应站点配置目录），
# 替换证书路径、服务器名与 upstream 地址后重载 nginx。

upstream crbs_backend {
    # crbs-server 默认监听 127.0.0.1:9090
    server 127.0.0.1:9090;

    # 可选：配置多个本地/远程后端实例时使用负载均衡
    # server 127.0.0.1:9091;
}

server {
    listen 80;
    server_name crbs.example.com;

    # HTTP 自动跳转 HTTPS（生产环境建议启用）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crbs.example.com;

    # TLS 证书
    ssl_certificate     /etc/pki/tls/certs/crbs.example.com.crt;
    ssl_certificate_key /etc/pki/tls/private/crbs.example.com.key;

    # 推荐 TLS 配置
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 上传大小限制：必须 >= server.toml 中的 upload_max_size_mb（默认 500MB）
    client_max_body_size 600m;

    # 日志
    access_log /var/log/nginx/crbs.access.log;
    error_log  /var/log/nginx/crbs.error.log;

    # SSE（Web UI 实时事件流四端点：/ui/events、/ui/builds/{id}/events、
    # /ui/builds/{id}/logs/stream、/ui/tasks/{id}/events——log 流结尾是
    # stream 不是 events，正则须两者都收）
    # 必须关闭 proxy_buffering：开启时事件会被 nginx 缓冲，页面更新明显延迟
    location ~ /(events|logs/stream)$ {
        proxy_pass         http://crbs_backend;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass         http://crbs_backend;
        proxy_http_version 1.1;

        # 透传真实连接信息
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上游响应超时（构建状态轮询、日志流可能需要较长时间）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 禁用缓存 API 响应
        proxy_cache_bypass $http_upgrade;
    }
}
